name: rate

ports:
  - port: 8084
    appProtocol: grpc
    targetPort: 8084
 
container:
  command: ./rate
  image: deathstarbench/hotel-reservation
  name: hotel-reserv-rate
  ports:
  - containerPort: 8084

configMaps:
  - name: service-config.json
    mountPath: config.json
    value: service-config
